<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAPPY Brain 診断専用</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:28px auto;padding:0 18px;line-height:1.6}button{font:inherit;padding:12px 20px;border-radius:10px;border:1px solid #555}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f4f4;padding:14px;border-radius:8px}small{color:#555}</style></head>
<body><h1>CHAPPY Brain 診断専用</h1>
<p>診断用Workerに1回だけ短い質問を送ります。ページを開くだけでは通信しません。</p>
<button id="run">1回だけ問い合わせる</button>
<p id="state" role="status">待機中</p><pre id="output">まだテストしていません。</pre>
<small>送信先: chappy-brain-diagnostic /chat。APIキーはブラウザに保存・表示しません。再試行は自動で行いません（Worker内部の503リトライは別）。</small>
<script>
const button=document.getElementById('run'),state=document.getElementById('state'),output=document.getElementById('output');
let used=false;
button.addEventListener('click',async()=>{
 if(used)return; used=true;button.disabled=true;
 state.textContent='通信中（最大30秒程度）';output.textContent='処理中…';
 const started=performance.now();
 try{
  const response=await fetch('https://chappy-brain-diagnostic.teratera412.workers.dev/chat',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({message:'こんにちは。短く一言で返事して。',history:[]})
  });
  const elapsedMs=Math.round(performance.now()-started);
  let data;try{data=await response.json()}catch{data={error:'NON_JSON_RESPONSE'}}
  state.textContent=response.ok?'通信完了':'エラー応答';
  output.textContent=JSON.stringify({httpStatus:response.status,clientElapsedMs:elapsedMs,...data},null,2);
 }catch(e){
  state.textContent='通信失敗';
  output.textContent=JSON.stringify({clientElapsedMs:Math.round(performance.now()-started),error:String(e)},null,2);
 }
});
</script></body></html>
