<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAPPY 0-C 音声実験</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#0c0d10;color:#f5f5f5}main{max-width:560px;margin:auto;padding:22px 16px}h1{font-size:24px}.panel{background:#1a1c22;border:1px solid #41434a;border-radius:18px;padding:18px;margin:18px 0}button{background:#a52d26;color:#fff;border:0;border-radius:14px;font-size:18px;padding:16px;width:100%;font-weight:700}button:disabled{opacity:.4}p{line-height:1.7}.muted{color:#aaa;font-size:13px}.line{font-size:20px;font-weight:700;min-height:2em}a{color:#ffc59e}</style></head><body><main>
<p class="muted">PROJECT WITH CHAPPY / EXPERIMENT 0-C-1</p><h1>🎤 CHAPPY 音声認識実験</h1>
<p>0-Bの合格版は変更していません。これは独立した実験ページです。</p>
<div class="panel"><p id="status">待機中</p><button id="start">🎤 話しかける</button><p class="muted">マイクの許可が出たら許可してください。短く「おはよう」と話してね。</p></div>
<div class="panel"><p class="muted">聞き取った言葉</p><p class="line" id="heard">まだありません</p><p class="muted">CHAPPYの返事（仮の頭脳）</p><p class="line" id="reply">まだありません</p></div>
<p class="muted" id="support"></p><p><a href="./">← 合格済みAvatar 0-Bに戻る</a></p>
<script>
const statusEl=document.querySelector('#status'),heard=document.querySelector('#heard'),reply=document.querySelector('#reply'),btn=document.querySelector('#start');
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){btn.disabled=true;statusEl.textContent='このブラウザは音声認識APIに対応していません';document.querySelector('#support').textContent='Android Chromeで開いて試してください。対応状況は端末やブラウザによって異なります。'}
else{const recognition=new SpeechRecognition();recognition.lang='ja-JP';recognition.interimResults=false;recognition.maxAlternatives=1;
recognition.onstart=()=>{statusEl.textContent='LISTEN｜聞いています';btn.disabled=true};
recognition.onresult=e=>{const words=e.results[0][0].transcript;heard.textContent=words;statusEl.textContent='THINK｜返事を準備中';const answer=/おはよう/.test(words)?'おはようございます！チャッピーです。今日もよろしくお願いします！':/こんにちは/.test(words)?'こんにちは！チャッピーです！':'聞こえました。「'+words+'」ですね！';reply.textContent=answer;
if(!('speechSynthesis'in window)){statusEl.textContent='読み上げ非対応';return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(answer);u.lang='ja-JP';u.rate=1;u.onstart=()=>statusEl.textContent='TALK｜返事を読み上げ中';u.onend=()=>statusEl.textContent='IDLE｜待機中';u.onerror=()=>statusEl.textContent='音声読み上げエラー';speechSynthesis.speak(u)};
recognition.onerror=e=>{statusEl.textContent='認識エラー：'+e.error};
recognition.onend=()=>{btn.disabled=false;if(statusEl.textContent.startsWith('LISTEN'))statusEl.textContent='IDLE｜音声を検出できませんでした'};
btn.onclick=()=>{try{recognition.start()}catch(e){statusEl.textContent='開始できません：'+e.message}};}
</script></main></body></html>
