<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAPPY Brain 接続試験</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:36px auto;padding:0 20px;background:#101725;color:#f2f6ff}h1{font-size:1.55rem}p{line-height:1.65;color:#bac7d9}textarea{box-sizing:border-box;width:100%;height:100px;border:1px solid #52647c;border-radius:12px;background:#202c3e;color:white;padding:14px;font:inherit}button{margin-top:14px;background:#62b5ff;color:#071522;font-weight:700;border:0;border-radius:12px;padding:15px 24px;font-size:1rem}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#202c3e;padding:18px;border-radius:12px;min-height:70px}small{color:#bac7d9}</style></head><body><h1>🤖 CHAPPY Brain 初会話テスト</h1><p>これは0-C③の接続確認専用ページです。アバター本体には変更を加えていません。</p><label for="msg">CHAPPYへの質問</label><textarea id="msg" maxlength="500">こんにちは！あなたは誰？</textarea><br><button id="send">CHAPPYに質問する</button><h2>応答結果</h2><pre id="result">まだ送信していません。</pre><small>※質問するとGemini APIへのリクエストが1回発生します。個人情報や秘密情報は入力しないでください。</small><script>const b=document.getElementById("send"),o=document.getElementById("result");b.onclick=async()=>{b.disabled=true;o.textContent="送信中…";try{const r=await fetch("https://chappy-brain-test.teratera412.workers.dev/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:document.getElementById("msg").value})});const d=await r.json();o.textContent=r.ok?"✅ "+d.reply:"❌ HTTP "+r.status+"\n"+JSON.stringify(d,null,2)}catch(e){o.textContent="❌ 通信エラー: "+e.message}finally{b.disabled=false}};</script></body></html>
