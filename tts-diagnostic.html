<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHAPPY TTS Diagnostic</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{margin:0;background:#0c0d10;color:#f5f5f5}
main{max-width:680px;margin:auto;padding:20px}
h1{font-size:24px;margin:0 0 8px}.sub{color:#aaa;font-size:13px;margin-bottom:16px}
.card{background:#15171c;border:1px solid #343840;border-radius:16px;padding:14px;margin:12px 0}
button{width:100%;padding:15px;margin:7px 0;border-radius:13px;border:1px solid #444;background:#20232a;color:#fff;font-size:16px;font-weight:800}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55;color:#ddd}
.ok{color:#7ee787}.bad{color:#ff7b72}
</style>
</head>
<body><main>
<h1>CHAPPY｜Android TTS切り分け</h1>
<div class="sub">AI・会話履歴・アバターを全部外して、ブラウザの音声合成だけを直接テストします。</div>

<div class="card">
  <div id="support"></div>
  <div id="voiceCount"></div>
</div>

<div class="card">
  <button id="refresh">🔄 音声一覧を再取得</button>
  <button id="defaultTest">▶ OS既定音声でテスト</button>
  <button id="jaTest">▶ 日本語音声を明示してテスト</button>
  <button id="resumeTest">▶ resume後にテスト</button>
  <button id="cancelBtn">⏹ cancel</button>
</div>

<div class="card"><b>結果</b><pre id="log">待機中</pre></div>
<div class="card"><b>検出された音声</b><pre id="voices">未取得</pre></div>

<script>
const synth=window.speechSynthesis;
const support=document.getElementById('support');
const voiceCount=document.getElementById('voiceCount');
const log=document.getElementById('log');
const voicesEl=document.getElementById('voices');
let voices=[];

function stamp(msg){
  log.textContent=new Date().toLocaleTimeString()+'  '+msg+'\n'+log.textContent;
}
function loadVoices(){
  if(!('speechSynthesis' in window)){
    support.innerHTML='<span class="bad">speechSynthesis 非対応</span>';
    return;
  }
  support.innerHTML='<span class="ok">speechSynthesis 対応</span>';
  voices=synth.getVoices();
  voiceCount.textContent='voice count: '+voices.length;
  voicesEl.textContent=voices.length
    ? voices.map((v,i)=>i+': '+v.name+' | '+v.lang+' | default='+v.default+' | local='+v.localService).join('\n')
    : '0件';
  stamp('voices取得: '+voices.length+'件');
}
if('speechSynthesis' in window){
  synth.onvoiceschanged=loadVoices;
}
loadVoices();
setTimeout(loadVoices,500);
setTimeout(loadVoices,1500);

function run(label,voice,doResume=false){
  if(!('speechSynthesis' in window)){stamp(label+': 非対応');return;}
  if(doResume){try{synth.resume();stamp('resume実行');}catch(e){stamp('resume例外: '+e.message);}}
  const u=new SpeechSynthesisUtterance('チャッピーの音声テストです。聞こえていますか。');
  u.lang='ja-JP';u.rate=1;u.pitch=1;u.volume=1;
  if(voice)u.voice=voice;
  u.onstart=()=>stamp(label+': onstart');
  u.onend=()=>stamp(label+': onend');
  u.onerror=(e)=>stamp(label+': onerror = '+(e.error||'unknown'));
  try{
    synth.speak(u);
    stamp(label+': speak投入 / pending='+synth.pending+' / speaking='+synth.speaking+' / paused='+synth.paused);
  }catch(e){stamp(label+': 例外 = '+e.message);}
}

document.getElementById('refresh').onclick=loadVoices;
document.getElementById('defaultTest').onclick=()=>run('既定音声',null,false);
document.getElementById('jaTest').onclick=()=>{
  loadVoices();
  const ja=voices.find(v=>String(v.lang).toLowerCase().startsWith('ja'));
  stamp('日本語voice: '+(ja?ja.name:'なし'));
  run('日本語音声',ja||null,false);
};
document.getElementById('resumeTest').onclick=()=>run('resume後テスト',null,true);
document.getElementById('cancelBtn').onclick=()=>{try{synth.cancel();stamp('cancel実行');}catch(e){stamp('cancel例外: '+e.message);}};
</script>
</main></body></html>
